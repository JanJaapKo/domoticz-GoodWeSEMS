name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install requests coverage

      - name: Run unittest suite with coverage
        run: python -m coverage run --source=. plugin_test.py

      - name: Enforce production coverage floor
        run: python -m coverage report --fail-under=80 -m GoodWe.py plugin.py exceptions.py

      - name: Run fake Domoticz plugin tests
        run: python manual_test.py

      - name: Check Python syntax
        run: python -m compileall -q GoodWe.py plugin.py exceptions.py fakeDomoticz.py